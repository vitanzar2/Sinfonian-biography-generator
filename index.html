<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sinfonian Biography Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div>
      <p class="eyebrow">Phi Mu Alpha Sinfonia</p>
      <h1>Formal Biography Sheet Builder</h1>
    </div>

    <div class="harmony-lockup">
      <span>among men</span>
      <strong>harmony</strong>
    </div>
  </header>

  <main class="app-shell">

    <section class="panel">
      <h2>Fill in the sheet</h2>

      <label>Full Name</label>
      <input id="fullName" type="text" value="John Doe" />

      <label>Organization</label>
      <p class="field-hint">Put your chapter, province, or alumni association here</p>
      <input id="chapter" type="text" value="Alpha Alpha Chapter" />

      <label>School</label>
      <input id="school" type="text" value="Example University" />

      <label>Hometown</label>
      <input id="hometown" type="text" value="Hometown, State" />

      <label>Major / Field</label>
      <input id="major" type="text" value="Music Education" />

      <label>Voice / Instrument</label>
      <input id="voiceOrInstrument" type="text" value="Baritone Voice" />

      <label>Graduation Year</label>
      <input id="graduationYear" type="text" value="2026" />

      <label>Already Graduated?</label>
      <select id="hasGraduated">
        <option value="no" selected>No</option>
        <option value="yes">Yes</option>
      </select>

      <label>Musical involvement / ensembles</label>
      <textarea id="musicalInvolvement" placeholder="Choirs, bands, orchestras, productions, studio work, etc."></textarea>

      <label>Fraternity leadership accomplishments</label>
      <textarea id="leadershipAccomplishments" placeholder="Key chapter projects, mentorship, growth outcomes, etc."></textarea>

      <label>Why they joined Sinfonia</label>
      <textarea id="whyJoined" placeholder="Motivation for joining and what brotherhood means to them."></textarea>

      <label>Career goals</label>
      <textarea id="careerGoals" placeholder="Future plans in music, education, performance, or beyond."></textarea>

      <label>Service and community engagement</label>
      <textarea id="serviceEngagement" placeholder="Campus service, outreach, volunteer work, benefit events, etc."></textarea>

      <label>Leadership Positions</label>
      <div class="checkbox-grid" id="positionSelections">
        <label><input type="checkbox" value="president" /> President</label>
        <label><input type="checkbox" value="vicePresident" /> Vice President</label>
        <label><input type="checkbox" value="fraternityEducationOfficer" /> Fraternity Education Officer</label>
        <label><input type="checkbox" value="treasurer" /> Treasurer</label>
      </div>

      <label>Additional Notes</label>
      <textarea id="bioNotes"></textarea>

      <label>Profile Photo (JPG or PNG)</label>
      <input id="profilePhoto" type="file" accept="image/png,image/jpeg" />
    </section>

    <section class="panel">

      <div class="toolbar">
        <button id="resetButton">Reset</button>
        <button id="downloadButton">Download PDF</button>
      </div>

      <div class="preview-card">
        <object class="pdf-preview" data="template.pdf" type="application/pdf">
          <p>PDF preview unavailable in this browser. The file is still used for export.</p>
        </object>
      </div>

      <p id="statusMessage"></p>

    </section>

  </main>

  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
